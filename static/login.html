<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070708">
  <meta name="color-scheme" content="dark">
  <title>Sign in · EvenUp</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/common.js" defer></script>
  <script src="/static/auth.js" defer></script>
  <script src="/static/login.js" defer></script>
</head>
<body>
<header class="top">
  <a href="/" class="logo"><span class="logo-mark"></span>EvenUp</a>
  <a href="/" class="btn small"><svg class="i sm"><use href="/static/icons.svg#chevleft"/></svg>Home</a>
</header>

<main class="page">
  <div class="head">
    <p class="eyebrow">Your account</p>
    <h1 id="title">Sign in</h1>
    <p class="muted" id="sub"></p>
  </div>
  <form id="auth" class="stack-lg">
    <div class="stack" data-field="name">
      <label class="label" for="name">Your name</label>
      <input class="field" type="text" id="name" maxlength="40" autocomplete="name" placeholder="As your friends know you">
    </div>
    <div class="stack" data-field="email">
      <label class="label" for="email">Email</label>
      <input class="field" type="email" id="email" maxlength="254" autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="stack" data-field="password">
      <label class="label" for="password" id="password-label">Password</label>
      <input class="field" type="password" id="password" minlength="8" maxlength="128" placeholder="At least 8 characters">
    </div>
    <p class="note" id="note" role="status"></p>
    <p class="error" id="error" role="alert"></p>
    <button class="btn ink block" type="submit" id="submit">Sign in</button>
    <div class="stack center">
      <button type="button" class="link-btn" id="alt-1"></button>
      <button type="button" class="link-btn" id="alt-2"></button>
    </div>
  </form>
  <p class="center muted small-text">Tabs work without an account. <a class="link-btn" href="/new">Open one now</a></p>
</main>
</body>
</html>
