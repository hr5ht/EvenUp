<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fafaf9">
  <title>Sign in · QuickTab</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script src="/static/common.js" defer></script>
  <script src="/static/auth.js" defer></script>
  <script src="/static/login.js" defer></script>
</head>
<body>
<header class="topbar">
  <a href="/" class="logo">QuickTab</a>
  <div class="row"><button type="button" class="small theme-toggle" id="theme" aria-label="Switch light or dark theme"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
</header>

<main class="two-col stagger">
  <aside>
    <h1 class="display" id="title">Sign in</h1>
    <p class="muted" id="sub"></p>
  </aside>
  <div>
    <form id="auth" class="card glow-card">
      <div class="fields">
      <div data-field="name">
        <label for="name">Your name</label>
        <input type="text" id="name" maxlength="40" autocomplete="name" placeholder="Your name">
      </div>
      <div data-field="email">
        <label for="email">Email</label>
        <input type="email" id="email" maxlength="254" autocomplete="email" placeholder="you@example.com">
      </div>
      <div data-field="password">
        <label for="password" id="password-label">Password</label>
        <input type="password" id="password" minlength="8" maxlength="128" placeholder="At least 8 characters">
      </div>
      </div>

      <p class="muted" id="note" role="status"></p>
      <p class="error" id="error" role="alert"></p>
      <button class="primary block" type="submit" id="submit">Sign in</button>

      <div class="actions">
        <button type="button" class="link" id="alt-1"></button>
        <button type="button" class="link" id="alt-2"></button>
      </div>
    </form>
  </div>
</main>
</body>
</html>
