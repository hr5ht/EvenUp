<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08090a" data-fixed>
  <meta name="color-scheme" content="dark">
  <title>Sign in · QuickTab</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script src="/static/common.js" defer></script>
  <script src="/static/auth.js" defer></script>
  <script src="/static/login.js" defer></script>
</head>
<body class="page">
<header class="topbar">
  <a href="/" class="logo">QuickTab</a>
  <div class="end"><a class="textlink" href="/"><svg class="i sm"><use href="/static/icons.svg#chevleft"/></svg>Home</a></div>
</header>

<main class="wrap auth">
  <div class="auth-form rise">
    <p class="eyebrow">Your account</p>
    <h1 id="title">Sign in</h1>
    <p class="muted" id="sub"></p>
    <form id="auth">
      <div data-field="name">
        <label for="name">Your name</label>
        <input type="text" id="name" maxlength="40" autocomplete="name" placeholder="As your friends know you">
      </div>
      <div data-field="email">
        <label for="email">Email</label>
        <input type="email" id="email" maxlength="254" autocomplete="email" placeholder="you@example.com">
      </div>
      <div data-field="password">
        <label for="password" id="password-label">Password</label>
        <input type="password" id="password" minlength="8" maxlength="128" placeholder="At least 8 characters">
      </div>
      <p class="muted" id="note" role="status"></p>
      <p class="error" id="error" role="alert"></p>
      <button class="primary" type="submit" id="submit">Sign in</button>
      <div class="auth-alt">
        <button type="button" class="link" id="alt-1"></button>
        <button type="button" class="link" id="alt-2"></button>
      </div>
    </form>
  </div>
  <div class="auth-vis" aria-hidden="true">
    <div class="pay-card">
      <p class="pay-to"><span class="avatar">Ri</span><span><b>Riya</b><span>riya@okhdfcbank</span></span></p>
      <p class="pay-amt">₹2,300<small>.00</small></p>
      <div class="pay-apps"><span>Google Pay</span><span>PhonePe</span><span>Paytm</span><span>BHIM</span></div>
      <div class="pay-go">Pay now</div>
    </div>
    <p class="auth-quote">Your tabs, friends and UPI ID in one place. Quick tabs still work without an account.</p>
  </div>
</main>
</body>
</html>
