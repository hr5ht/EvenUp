<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fafaf9">
  <title>Friends · QuickTab</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script src="/static/common.js" defer></script>
  <script src="/static/auth.js" defer></script>
  <script src="/static/friends.js" defer></script>
</head>
<body>
<header class="topbar">
  <a href="/" class="logo">QuickTab</a>
  <div class="row"><a class="button small" href="/profile">Profile</a><button type="button" class="small theme-toggle" id="theme" aria-label="Switch light or dark theme"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
</header>

<main class="two-col stagger">
  <aside>
    <h1 class="display">Friends</h1>
    <p class="muted">Add a friend by their email. If they're new to QuickTab, your request will be waiting when they sign up.</p>
  </aside>
  <div id="page" class="fields" hidden>
    <form id="add" class="card glow-card">
      <label for="email">Their email</label>
      <div class="row">
        <input type="email" id="email" maxlength="254" autocomplete="off" placeholder="friend@example.com" required>
        <button class="primary" type="submit" id="send">Add</button>
      </div>
      <p class="muted" id="note" role="status"></p>
      <p class="error" id="error" role="alert"></p>
    </form>

    <section class="card" id="requests-card" hidden>
      <p class="overline people-title">Requests</p>
      <ul class="people" id="requests"></ul>
    </section>

    <section class="card">
      <p class="overline people-title">Your friends</p>
      <ul class="people" id="friends"></ul>
    </section>

    <section class="card" id="sent-card" hidden>
      <p class="overline people-title">Sent</p>
      <ul class="people" id="sent"></ul>
    </section>
  </div>
</main>
</body>
</html>
