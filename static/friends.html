<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070708">
  <meta name="color-scheme" content="dark">
  <title>Friends · EvenUp</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/common.js" defer></script>
  <script src="/static/auth.js" defer></script>
  <script src="/static/friends.js" defer></script>
</head>
<body>
<header class="top">
  <a href="/profile" class="icon-btn" aria-label="Back"><svg class="i"><use href="/static/icons.svg#chevleft"/></svg></a>
</header>
<main class="page" id="page" hidden>
  <div class="head"><p class="eyebrow">People</p><h1>Friends</h1><p class="muted">Add a friend by email. If they're new to EvenUp, your request waits until they sign up.</p></div>
  <form id="add" class="card stack">
    <label class="label" for="email">Their email</label>
    <input class="field" type="email" id="email" maxlength="254" autocomplete="off" placeholder="friend@example.com" required>
    <button class="btn ink" type="submit" id="send"><svg class="i"><use href="/static/icons.svg#userplus"/></svg>Add friend</button>
    <p class="note" id="note" role="status"></p>
    <p class="error" id="error" role="alert"></p>
  </form>
  <section class="stack" id="requests-card" hidden><h2>Requests</h2><div class="list" id="requests"></div></section>
  <section class="stack"><div class="sec-title"><h2>Your friends</h2><span class="count" id="n-friends"></span></div><div class="list" id="friends"></div></section>
  <section class="stack" id="sent-card" hidden><h2>Sent, waiting</h2><div class="list" id="sent"></div></section>
</main>
</body>
</html>
