<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08090a" data-fixed>
  <meta name="color-scheme" content="dark">
  <title>Friends · QuickTab</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script src="/static/common.js" defer></script>
  <script src="/static/auth.js" defer></script>
  <script src="/static/shell.js" defer></script>
  <script src="/static/friends.js" defer></script>
</head>
<body class="page">
<div class="app">
  <aside class="sidebar">
    <a href="/" class="logo">QuickTab</a>
    <nav class="side-nav" aria-label="Your account"><a href="/dashboard"><svg class="i"><use href="/static/icons.svg#home"/></svg>Home</a><a href="/friends" aria-current="page"><svg class="i"><use href="/static/icons.svg#users"/></svg>Friends</a><a href="/profile"><svg class="i"><use href="/static/icons.svg#user"/></svg>Profile</a></nav>
    <div class="side-user"><span class="avatar" id="side-avatar"></span><span class="grow"><b id="side-name"></b><span id="side-email"></span></span></div>
  </aside>
  <main class="main">
    <div class="main-bar"><span class="crumb">Friends</span><a href="/" class="logo">QuickTab</a></div>
    <div class="page-title rise"><h1>Friends</h1><p>Add a friend by email. If they're new to QuickTab, your request waits until they sign up.</p></div>
    <div id="page" class="content-narrow" hidden>
      <form id="add" class="card">
        <label for="email">Their email</label>
        <div class="add-row">
          <input type="email" id="email" maxlength="254" autocomplete="off" placeholder="friend@example.com" required>
          <button class="primary" type="submit" id="send"><svg class="i"><use href="/static/icons.svg#userplus"/></svg>Add friend</button>
        </div>
        <p class="note" id="note" role="status"></p>
        <p class="error" id="error" role="alert"></p>
      </form>
      <section class="panel" id="requests-card" hidden><h2>Requests</h2><div id="requests"></div></section>
      <section class="panel"><h2>Your friends</h2><div id="friends"></div></section>
      <section class="panel" id="sent-card" hidden><h2>Sent, waiting for an answer</h2><div id="sent"></div></section>
    </div>
  </main>
</div>
<nav class="tabbar" aria-label="Your account"><a href="/dashboard"><svg class="i"><use href="/static/icons.svg#home"/></svg>Home</a><a href="/friends" aria-current="page"><svg class="i"><use href="/static/icons.svg#users"/></svg>Friends</a><a href="/profile"><svg class="i"><use href="/static/icons.svg#user"/></svg>Profile</a></nav>
</body>
</html>
