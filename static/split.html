<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>EvenUp split</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/common.js" defer></script>
  <script src="/static/split.js" defer></script>
</head>
<body>
<main>
  <p class="muted no-print"><a href="/">EvenUp</a></p>
  <h1 id="title">Loading…</h1>
  <p class="error" id="load-error"></p>
  <p class="muted no-print you-bar"><span id="you-text"></span> <button type="button" id="switch" class="link">Switch</button></p>
  <div class="banner no-print" id="expiry" hidden></div>

  <form class="card no-print" id="upi-form" hidden>
    <label for="my-upi">Add your UPI ID so people can pay you</label>
    <div class="row">
      <input type="text" id="my-upi" maxlength="100" placeholder="name@bank" required>
      <button class="primary" type="submit">Save</button>
    </div>
    <p class="error" id="upi-error"></p>
  </form>

  <div id="content" hidden>
    <section class="card">
      <h2>Settle up</h2>
      <ul class="list" id="settlement"></ul>
      <div class="actions">
        <button type="button" id="copy-summary" class="small">Copy as text</button>
        <button type="button" id="download-png" class="small">Image</button>
        <button type="button" id="print-pdf" class="small">PDF</button>
      </div>
    </section>

    <section class="card">
      <h2>Balances</h2>
      <ul class="list" id="balances"></ul>
    </section>

    <form class="card no-print" id="expense-form">
      <h2 id="form-title">Add expense</h2>
      <label for="desc">Description</label>
      <input type="text" id="desc" maxlength="100" placeholder="Dinner" required>

      <label for="amount">Amount (₹)</label>
      <input type="text" id="amount" inputmode="decimal" placeholder="1200" required>

      <label for="paid-by">Paid by</label>
      <select id="paid-by"></select>

      <label>Split</label>
      <div class="checks">
        <label><input type="radio" name="split" value="equal" checked> Equally</label>
        <label><input type="radio" name="split" value="exact"> Exact amounts</label>
      </div>
      <div id="equal-box" class="checks"></div>
      <div id="exact-box" hidden></div>

      <p class="error" id="form-error"></p>
      <div class="actions">
        <button class="primary" type="submit" id="save">Add expense</button>
        <button type="button" id="cancel-edit" hidden>Cancel</button>
      </div>
    </form>

    <section class="card">
      <h2>Expenses</h2>
      <ul class="list" id="expenses"></ul>
    </section>

    <section class="card no-print">
      <h2>Activity</h2>
      <ul class="list" id="activity"></ul>
    </section>

    <section class="card no-print" id="admin" hidden>
      <h2>Admin</h2>
      <ul class="list" id="admin-members"></ul>
      <label for="new-member">Add someone</label>
      <div class="row">
        <input type="text" id="new-member" maxlength="40" placeholder="Name">
        <input type="text" id="new-member-upi" maxlength="100" placeholder="UPI ID (optional)">
        <button type="button" id="add-member">Add</button>
      </div>
      <p class="error" id="admin-error"></p>
      <div class="actions"><button type="button" id="delete-split">Delete this split now</button></div>
    </section>
  </div>

  <dialog id="who-dialog">
    <h2 id="who-title">Who are you?</h2>
    <div id="who-list" class="who-list"></div>
    <div class="actions">
      <button type="button" id="join-open" class="link">I'm not on the list</button>
      <button type="button" id="admin-open" class="link">I'm the admin</button>
    </div>
    <form id="join-form" hidden>
      <label for="join-name">Your name</label>
      <input type="text" id="join-name" maxlength="40" required>
      <label for="join-upi">UPI ID <span class="muted">(optional, so people can pay you)</span></label>
      <input type="text" id="join-upi" maxlength="100" placeholder="name@bank">
      <p class="error" id="join-error"></p>
      <div class="actions">
        <button class="primary" type="submit">Join</button>
        <button type="button" id="join-back" class="link">Back</button>
      </div>
    </form>
    <form id="pw-form" hidden>
      <label for="admin-pw">Enter the admin password to manage this split.</label>
      <input type="password" id="admin-pw" maxlength="100" autocomplete="current-password" required>
      <p class="error" id="pw-error"></p>
      <div class="actions">
        <button class="primary" type="submit">Unlock</button>
        <button type="button" id="pw-back" class="link">Back</button>
      </div>
    </form>
    <p class="muted" id="demo-hint" hidden>Demo admin password: <strong>demo</strong></p>
  </dialog>

  <dialog id="qr-dialog">
    <img id="qr-img" alt="UPI QR code" width="240" height="240">
    <p id="qr-caption" class="muted"></p>
    <p class="muted">Scan with any UPI app.</p>
    <div class="actions"><button type="button" id="qr-close">Close</button></div>
  </dialog>
</main>
</body>
</html>
