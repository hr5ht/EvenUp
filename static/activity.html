<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070708">
  <meta name="color-scheme" content="dark">
  <title>Activity · QuickTab</title>
  <link rel="preload" href="/static/fonts/serif-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/common.js" defer></script>
  <script src="/static/auth.js" defer></script>
  <script src="/static/shell.js" defer></script>
  <script src="/static/activity.js" defer></script>
</head>
<body class="shell">
<div class="app">
  <aside class="sidebar">
    <a href="/" class="logo"><span class="logo-mark"></span>QuickTab</a>
    <button type="button" class="primary side-cta" data-open="new-sheet"><svg class="i"><use href="/static/icons.svg#plus"/></svg>New</button>
    <nav class="side-nav" aria-label="Your account"><a href="/dashboard"><svg class="i"><use href="/static/icons.svg#home"/></svg>Home</a><a href="/activity" aria-current="page"><svg class="i"><use href="/static/icons.svg#history"/></svg>Activity</a><a href="/friends"><svg class="i"><use href="/static/icons.svg#users"/></svg>Friends</a></nav>
    <a class="side-user" href="/profile"><span class="avatar" id="side-avatar"></span><span class="grow"><b id="side-name"></b><span id="side-email"></span></span></a>
  </aside>
  <main class="main">
    <div class="main-bar"><a href="/" class="logo"><span class="logo-mark"></span>QuickTab</a></div>
    <header class="page-title"><p class="eyebrow">Your groups</p><h1>Activity</h1><p>Every change in your groups, newest first.</p></header>
    <div id="page" class="content-narrow" hidden>
      <div id="feed"></div>
      <p class="error" id="error" role="alert"></p>
    </div>
  </main>
</div>
<nav class="tabbar" aria-label="Your account"><a href="/dashboard"><svg class="i"><use href="/static/icons.svg#home"/></svg>Home</a><a href="/activity" aria-current="page"><svg class="i"><use href="/static/icons.svg#history"/></svg>Activity</a><a href="/new" class="tab-plus" aria-label="New"><svg class="i"><use href="/static/icons.svg#plus"/></svg></a><a href="/friends"><svg class="i"><use href="/static/icons.svg#users"/></svg>Friends</a><a href="/profile"><svg class="i"><use href="/static/icons.svg#user"/></svg>Profile</a></nav>
<dialog class="sheet" id="new-sheet">
  <div class="sheet-head"><h2>New</h2><button type="button" class="icon-btn" data-close aria-label="Close"><svg class="i"><use href="/static/icons.svg#x"/></svg></button></div>
  <div class="sheet-body">
    <div class="menu">
      <a class="choice" href="/new"><span class="ic"><svg class="i"><use href="/static/icons.svg#receipt"/></svg></span><span class="grow">Quick tab<span>One trip or dinner. Closes on its own</span></span></a>
      <a class="choice" href="/dashboard#new-group" data-open="group-sheet"><span class="ic"><svg class="i"><use href="/static/icons.svg#users"/></svg></span><span class="grow">Group<span>People you split with often. Never expires</span></span></a>
    </div>
  </div>
</dialog>
</body>
</html>
