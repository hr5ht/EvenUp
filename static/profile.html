<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08090a" data-fixed>
  <meta name="color-scheme" content="dark">
  <title>Profile · QuickTab</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script src="/static/common.js" defer></script>
  <script src="/static/auth.js" defer></script>
  <script src="/static/shell.js" defer></script>
  <script src="/static/profile.js" defer></script>
</head>
<body class="page">
<div class="app">
  <aside class="sidebar">
    <a href="/" class="logo">QuickTab</a>
    <nav class="side-nav" aria-label="Your account"><a href="/dashboard"><svg class="i"><use href="/static/icons.svg#home"/></svg>Home</a><a href="/friends"><svg class="i"><use href="/static/icons.svg#users"/></svg>Friends</a><a href="/profile" aria-current="page"><svg class="i"><use href="/static/icons.svg#user"/></svg>Profile</a></nav>
    <div class="side-user"><span class="avatar" id="side-avatar"></span><span class="grow"><b id="side-name"></b><span id="side-email"></span></span></div>
  </aside>
  <main class="main">
    <div class="main-bar"><span class="crumb">Profile</span><a href="/" class="logo">QuickTab</a></div>
    <div class="page-title rise"><h1>Profile</h1><p id="email"></p></div>
    <div id="page" class="content-narrow" hidden>
      <form id="profile" class="card">
        <label for="name">Your name</label>
        <input type="text" id="name" maxlength="40" autocomplete="name" required>
        <label for="upi">Your UPI ID <span class="optional">Optional</span></label>
        <input type="text" id="upi" maxlength="321" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="name@bank">
        <p class="hint">So friends can pay you by UPI. Only people in your tabs see it.</p>
        <p class="error" id="error" role="alert"></p>
        <button class="primary block save" type="submit" id="save">Save</button>
      </form>
      <section class="card">
        <h2 class="card-title">Session</h2>
        <button type="button" class="block" id="sign-out"><svg class="i"><use href="/static/icons.svg#logout"/></svg>Sign out</button>
      </section>
      <section class="card">
        <h2 class="card-title">Delete account</h2>
        <p class="hint">This can't be undone. Your profile and friends list are removed.</p>
        <label for="delete-password">Enter your password to confirm</label>
        <input type="password" id="delete-password" maxlength="128" autocomplete="current-password" placeholder="Your password">
        <p class="error" id="delete-error" role="alert"></p>
        <button type="button" class="danger block" id="delete">Delete my account</button>
      </section>
    </div>
  </main>
</div>
<nav class="tabbar" aria-label="Your account"><a href="/dashboard"><svg class="i"><use href="/static/icons.svg#home"/></svg>Home</a><a href="/friends"><svg class="i"><use href="/static/icons.svg#users"/></svg>Friends</a><a href="/profile" aria-current="page"><svg class="i"><use href="/static/icons.svg#user"/></svg>Profile</a></nav>
</body>
</html>
