<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fafaf9">
  <title>Profile · QuickTab</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script src="/static/common.js" defer></script>
  <script src="/static/auth.js" defer></script>
  <script src="/static/profile.js" defer></script>
</head>
<body>
<header class="topbar">
  <a href="/" class="logo">QuickTab</a>
  <div class="row"><button type="button" class="small theme-toggle" id="theme" aria-label="Switch light or dark theme"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
</header>

<main class="two-col stagger">
  <aside>
    <h1 class="display">Your profile</h1>
    <p class="muted" id="email"></p>
  </aside>
  <div id="page" class="fields" hidden>
    <form id="profile" class="card glow-card">
      <label for="name">Your name</label>
      <input type="text" id="name" maxlength="40" autocomplete="name" required>

      <label for="upi">Your UPI ID <span class="badge">optional</span></label>
      <input type="text" id="upi" maxlength="321" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="name@bank">
      <p class="muted">Add it so friends can pay you by UPI. Only people in your groups will see it.</p>

      <p class="error" id="error" role="alert"></p>
      <button class="primary block save" type="submit" id="save">Save</button>
    </form>

    <div class="card">
      <button type="button" class="block" id="sign-out">Sign out</button>
      <div class="danger-zone">
        <p class="muted">Deleting your account can't be undone.</p>
        <label for="delete-password">Enter your password to delete it</label>
        <input type="password" id="delete-password" maxlength="128" autocomplete="current-password" placeholder="Your password">
        <p class="error" id="delete-error" role="alert"></p>
        <button type="button" class="danger block" id="delete">Delete my account</button>
      </div>
    </div>
  </div>
</main>
</body>
</html>
