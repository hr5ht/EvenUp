<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08090a" data-fixed>
  <meta name="color-scheme" content="dark">
  <title>Home · QuickTab</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script src="/static/common.js" defer></script>
  <script src="/static/auth.js" defer></script>
  <script src="/static/shell.js" defer></script>
  <script src="/static/dashboard.js" defer></script>
</head>
<body class="page">
<div class="app">
  <aside class="sidebar">
    <a href="/" class="logo">QuickTab</a>
    <nav class="side-nav" aria-label="Your account"><a href="/dashboard" aria-current="page"><svg class="i"><use href="/static/icons.svg#home"/></svg>Home</a><a href="/friends"><svg class="i"><use href="/static/icons.svg#users"/></svg>Friends</a><a href="/profile"><svg class="i"><use href="/static/icons.svg#user"/></svg>Profile</a></nav>
    <div class="side-user"><span class="avatar" id="side-avatar"></span><span class="grow"><b id="side-name"></b><span id="side-email"></span></span></div>
  </aside>
  <main class="main">
    <div class="main-bar">
      <span class="crumb">Home</span>
      <a href="/" class="logo">QuickTab</a>
      <div class="end">
        <a class="button wide-only" href="/friends"><svg class="i"><use href="/static/icons.svg#userplus"/></svg>Add a friend</a>
        <a class="button primary" href="/new"><svg class="i"><use href="/static/icons.svg#plus"/></svg>Open a tab</a>
      </div>
    </div>
    <div class="page-title rise"><h1 id="hello">Home</h1><p id="today"></p></div>

    <div id="page" hidden>
      <a class="prompt" id="upi-prompt" href="/profile" hidden>
        <span class="ic"><svg class="i"><use href="/static/icons.svg#wallet"/></svg></span>
        <span class="grow"><b>Add your UPI ID</b><span>So friends can pay you in one tap. You can skip this for now.</span></span>
        <span class="button small">Add UPI ID</span>
      </a>

      <div class="dash-grid">
        <section>
          <div class="sec-row"><h2>Quick tabs on this device</h2><span class="count" id="n-tabs"></span></div>
          <div class="slips" id="tabs"></div>
        </section>
        <aside>
          <section class="panel" id="requests-panel" hidden>
            <h2>Friend requests <span class="count" id="n-requests"></span></h2>
            <div id="requests"></div>
          </section>
          <section class="panel">
            <h2>Friends <span class="count" id="n-friends"></span></h2>
            <div id="friends"></div>
          </section>
        </aside>
      </div>
      <p class="error" id="error" role="alert"></p>
    </div>
  </main>
</div>
<nav class="tabbar" aria-label="Your account"><a href="/dashboard" aria-current="page"><svg class="i"><use href="/static/icons.svg#home"/></svg>Home</a><a href="/friends"><svg class="i"><use href="/static/icons.svg#users"/></svg>Friends</a><a href="/profile"><svg class="i"><use href="/static/icons.svg#user"/></svg>Profile</a></nav>
</body>
</html>
