<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fafaf9">
  <title>Dashboard · QuickTab</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script src="/static/common.js" defer></script>
  <script src="/static/auth.js" defer></script>
  <script src="/static/dashboard.js" defer></script>
</head>
<body>
<header class="topbar">
  <a href="/" class="logo">QuickTab</a>
  <div class="row"><button type="button" class="small theme-toggle" id="theme" aria-label="Switch light or dark theme"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
</header>
<nav class="subnav" aria-label="Your account">
  <a href="/dashboard" aria-current="page">Dashboard</a><a href="/friends">Friends</a><a href="/profile">Profile</a>
</nav>

<main class="two-col stagger">
  <aside>
    <h1 class="display" id="hello">Dashboard</h1>
    <p class="muted" id="email"></p>
  </aside>
  <div id="page" class="fields" hidden>
    <div class="dash-stats">
      <a class="card dash-stat" href="/friends"><span class="stat-num" id="n-friends">0</span><span class="muted">Friends</span></a>
      <a class="card dash-stat" href="/friends"><span class="stat-num" id="n-requests">0</span><span class="muted">Requests</span></a>
    </div>

    <a class="card dash-prompt" id="upi-prompt" href="/profile" hidden>
      <strong>Add your UPI ID</strong>
      <span class="muted">So friends can pay you. You can skip this for now.</span>
    </a>

    <section class="card glow-card">
      <p class="overline people-title">Start something</p>
      <div class="actions split2">
        <a class="button primary" href="/new">Open a tab</a>
        <a class="button" href="/friends">Add a friend</a>
      </div>
    </section>

    <section class="card">
      <p class="overline people-title">Quick tabs on this device</p>
      <ul class="people" id="tabs"></ul>
    </section>

    <p class="error" id="error" role="alert"></p>
  </div>
</main>
</body>
</html>
